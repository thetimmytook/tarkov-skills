name: Benchmark app

on:
  pull_request:
    paths:
      - 'apps/tarkov-performance-benchmark/**'
      - 'src/**'
      - 'config/**'
      - 'build/**'
      - '.github/actions/receive-store-artifact/**'
      - '.github/workflows/benchmark-app.yml'
      - '.github/workflows/store-build.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/store-build.yml
    with:
      product: benchmark
