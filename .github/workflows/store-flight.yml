name: Microsoft Store flight

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to submit to its private package flight
        required: true
        type: choice
        options: [benchmark, toolkit, both]
      benchmark_build_run_id:
        description: Benchmark main push build run ID (required when selected)
        type: string
      benchmark_build_attempt:
        description: Exact Benchmark build attempt (required when selected)
        type: string
      toolkit_build_run_id:
        description: Toolkit main push build run ID (required when selected)
        type: string
      toolkit_build_attempt:
        description: Exact Toolkit build attempt (required when selected)
        type: string
      production_api_ready:
        description: Production desktop-auth and Academy API contracts are confirmed ready
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require production API readiness confirmation
        if: inputs.production_api_ready != true
        run: |
          echo 'Production API readiness must be confirmed before submitting a Store flight.'
          exit 1
      - name: Select explicit build attempts
        id: plan
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product }}
          BENCHMARK_RUN: ${{ inputs.benchmark_build_run_id }}
          BENCHMARK_ATTEMPT: ${{ inputs.benchmark_build_attempt }}
          TOOLKIT_RUN: ${{ inputs.toolkit_build_run_id }}
          TOOLKIT_ATTEMPT: ${{ inputs.toolkit_build_attempt }}
        run: |
          $items = @()
          if ($env:PRODUCT -in 'benchmark', 'both') { $items += @{ product = 'benchmark'; run_id = $env:BENCHMARK_RUN; attempt = $env:BENCHMARK_ATTEMPT } }
          if ($env:PRODUCT -in 'toolkit', 'both') { $items += @{ product = 'toolkit'; run_id = $env:TOOLKIT_RUN; attempt = $env:TOOLKIT_ATTEMPT } }
          foreach ($item in $items) {
            if ($item.run_id -notmatch '^[1-9][0-9]*$' -or $item.attempt -notmatch '^[1-9][0-9]*$') { throw "Explicit build run ID and attempt are required for $($item.product)." }
          }
          "matrix=$(@{ include = $items } | ConvertTo-Json -Depth 5 -Compress)" | Out-File $env:GITHUB_OUTPUT -Append

  flight:
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    uses: ./.github/workflows/store-submit.yml
    with:
      product: ${{ matrix.product }}
      stage: flight
      run_id: ${{ matrix.run_id }}
      attempt: ${{ matrix.attempt }}
