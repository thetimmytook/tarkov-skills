name: Microsoft Store production promotion

on:
  workflow_dispatch:
    inputs:
      product:
        description: Flight-tested product to publish publicly
        required: true
        type: choice
        options: [benchmark, toolkit, both]
      flight_run_id:
        description: Successful Microsoft Store flight workflow run ID
        required: true
        type: string
      flight_attempt:
        description: Exact successful flight attempt containing submitted artifacts
        required: true
        type: string
      confirm_public_release:
        description: I confirm this creates a public Store submission after Environment approval
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require explicit public-release confirmation
        if: inputs.confirm_public_release != true
        run: |
          echo 'Public release confirmation was not provided.'
          exit 1
      - name: Select products from the explicit flight
        id: plan
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          $products = if ($env:PRODUCT -eq 'both') { @('benchmark', 'toolkit') } else { @($env:PRODUCT) }
          "matrix=$(@{ product = $products } | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_OUTPUT -Append

  production:
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    uses: ./.github/workflows/store-submit.yml
    secrets:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
    with:
      product: ${{ matrix.product }}
      stage: production
      run_id: ${{ inputs.flight_run_id }}
      attempt: ${{ inputs.flight_attempt }}
