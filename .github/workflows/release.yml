name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version in plugin manifest
        id: bump
        shell: pwsh
        run: |
          $manifestPath = ".claude-plugin/plugin.json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $parts = @($manifest.version -split '\.' | ForEach-Object { [int]$_ })
          switch ('${{ inputs.bump }}') {
            'major' { $parts[0]++; $parts[1] = 0; $parts[2] = 0 }
            'minor' { $parts[1]++; $parts[2] = 0 }
            default { $parts[2]++ }
          }
          $version = $parts -join '.'
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding UTF8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Open and merge version bump PR
        id: merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          # $ErrorActionPreference does not catch failures from native commands
          # (git, gh): a non-zero exit code alone does not stop the script, so
          # every step that must succeed is checked explicitly.
          function Invoke-Checked {
              param([string]$Description)
              if ($LASTEXITCODE -ne 0) {
                  throw "$Description failed with exit code $LASTEXITCODE"
              }
          }

          $version = "${{ steps.bump.outputs.version }}"
          $branch = "chore/release-v$version"

          # main is protected (PR required, no direct push, even for admins), so the
          # bump lands through a normal PR merge instead of a direct push.
          git config user.name "thetimmytook"
          git config user.email "timmytook.channel@gmail.com"
          git checkout -b $branch
          Invoke-Checked "git checkout -b $branch"
          git add .claude-plugin/plugin.json
          git commit -m "fix # BE # bump version to $version"
          Invoke-Checked "git commit"
          git push origin $branch
          Invoke-Checked "git push $branch"

          gh pr create --base main --head $branch --title "fix # BE # bump version to $version" --body ""
          Invoke-Checked "gh pr create"
          gh pr merge $branch --merge --delete-branch
          Invoke-Checked "gh pr merge"

          git checkout main
          Invoke-Checked "git checkout main"
          git pull --ff-only origin main
          Invoke-Checked "git pull main"

          # Belt-and-braces: refuse to tag/release a commit that does not
          # actually carry the version bump, even if every command above
          # reported success.
          $mergedVersion = (Get-Content -Raw ".claude-plugin/plugin.json" | ConvertFrom-Json).version
          if ($mergedVersion -ne $version) {
              throw "main is at version '$mergedVersion' after the merge, expected '$version'. The bump PR was not merged into main; refusing to tag."
          }

      - name: Verify bundled PresentMon
        shell: pwsh
        run: ./build/check-presentmon-dependency.ps1 -SkipUpstreamCheck

      - name: Test applications
        shell: pwsh
        run: |
          dotnet test apps/tarkov-performance-benchmark/TarkovPerformanceBenchmark.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw "Benchmark tests failed." }
          dotnet test apps/tarkov-performance-toolkit/TarkovPerformanceToolkit.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw "Toolkit tests failed." }

      - name: Build release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.bump.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null

          ./build/build-portable.ps1 -Version $version -OutputDirectory dist

          $skillsStaging = Join-Path $env:RUNNER_TEMP "tarkov-skills"
          New-Item -ItemType Directory -Force $skillsStaging | Out-Null
          Copy-Item -Recurse -Path skills -Destination $skillsStaging
          Copy-Item -Path AGENTS.md, CLAUDE.md, README.md, LICENSE -Destination $skillsStaging
          Compress-Archive -Path $skillsStaging -DestinationPath "dist/tarkov-skills-codex-$version.zip"

          git archive --format=zip --output "dist/tarkov-skills-source-$version.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive creation failed." }

      - name: Tag release
        shell: pwsh
        run: |
          $version = "${{ steps.bump.outputs.version }}"
          git tag "v$version"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag." }
          git push origin "v$version"
          if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag." }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## Install

          - [Tarkov Performance Toolkit on Microsoft Store](https://apps.microsoft.com/detail/9N3L7DZH0K64)
          - [Tarkov Performance Benchmark on Microsoft Store](https://apps.microsoft.com/detail/9PJMPQ06JL21)

          Microsoft Store is the recommended installation source. Self-contained portable Windows builds and the complete source archive are attached below for users who do not use the Store.
          '@
          gh release create "v${{ steps.bump.outputs.version }}" `
            "dist/TarkovPerformanceBenchmark-${{ steps.bump.outputs.version }}-win-x64.zip" `
            "dist/TarkovPerformanceToolkit-${{ steps.bump.outputs.version }}-win-x64.zip" `
            "dist/tarkov-skills-codex-${{ steps.bump.outputs.version }}.zip" `
            "dist/tarkov-skills-source-${{ steps.bump.outputs.version }}.zip" `
            --title "v${{ steps.bump.outputs.version }}" `
            --notes $notes `
            --generate-notes
