name: Performance toolkit

on:
  pull_request:
    paths:
      - "apps/tarkov-performance-toolkit/**"
      - "src/TarkovSkills.Core/**"
      - "src/TarkovBenchmark.Feature/**"
      - "build/build-toolkit-msix.ps1"
      - "build/check-presentmon-dependency.ps1"
      - "build/StoreRelease.psm1"
      - "build/test-msix-package.ps1"
      - "build/test-store-release.ps1"
      - "apps/tarkov-performance-toolkit/packaging/store-release.json"
      - ".github/workflows/toolkit-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/tarkov-performance-toolkit/**"
      - "src/TarkovSkills.Core/**"
      - "src/TarkovBenchmark.Feature/**"
      - "build/build-toolkit-msix.ps1"
      - "build/check-presentmon-dependency.ps1"
      - "build/StoreRelease.psm1"
      - "build/test-msix-package.ps1"
      - "build/test-store-release.ps1"
      - "apps/tarkov-performance-toolkit/packaging/store-release.json"
      - ".github/workflows/toolkit-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify bundled PresentMon
        shell: pwsh
        run: ./build/check-presentmon-dependency.ps1 -SkipUpstreamCheck
      - name: Test
        run: dotnet test apps/tarkov-performance-toolkit/TarkovPerformanceToolkit.sln -c Release
      - name: Build Store MSIX
        shell: pwsh
        run: ./build/build-toolkit-msix.ps1 -OutputDirectory artifacts/toolkit-msix
      - uses: actions/upload-artifact@v4
        with:
          name: tarkov-performance-toolkit-msix
          path: artifacts/toolkit-msix/*.msix
          if-no-files-found: error
          retention-days: 7
